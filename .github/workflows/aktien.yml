name: Aktien-Überwachung

on:
  schedule:
    - cron: '0 * * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Code ausladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bibliotheken installieren
        run: |
          pip install yfinance pandas requests

      - name: Bot starten
        run: python bot.py
